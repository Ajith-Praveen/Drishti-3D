[project]
name = "drishti3d"
version = "0.1.0"
description = "Desktop app that turns a single-pass drone video into a georeferenced 3D model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    # Headless: a Qt app must not load a second Qt from OpenCV, and one cv2 package keeps
    # every OS on the same (tested) OpenCV 4 -- mapanything already pulls in the headless wheel.
    "opencv-python-headless>=4.10,<5",
    "av",
    "pyproj",
    "laspy",
    "tqdm",
    "pydantic",
    "pyyaml",
    "rich",
    # Core, not optional: open3d provides the SPARSE TSDF path in
    # fusion.tsdf. Without it the pipeline silently falls back to a dense
    # numpy grid that measured 33.5% of total runtime on a 16-keyframe
    # run -- the single largest avoidable cost in the whole pipeline. A
    # "works but is several times slower, and nothing tells you" default is
    # the wrong default, so it moved out of the `geo` extra and in here.
    "open3d",
    # Real GeoTIFF output. Without a writer backend, export.geotiff falls
    # back to .npy + .tfw sidecars, which are NOT the GeoTIFF the
    # deliverable list asks for and which no GIS opens as a raster.
    # tifffile, not rasterio: rasterio drags in a full GDAL stack for a
    # writer this project already hand-rolls the tags for.
    "tifffile",
]

[project.optional-dependencies]
gui = [
    "pyside6",
    "vtk",
]
ml = [
    "torch",
    "torchvision",
    "mapanything @ git+https://github.com/facebookresearch/map-anything.git@3d10cf7a3016fc0f9bb13a071ee66c47b10be0d9",
    # DISK + LightGlue learned matching (geometry.learned_matching), the
    # default matching.method. In `ml`, not only in `matching`: run.sh
    # syncs exactly gui + ml, so a separate extra was uninstalled on every
    # launch.
    "kornia>=0.7.4",
]
# Per-frame semantic segmentation (drishti3d.semantics). Without this the
# pipeline still runs: SemanticsStage records itself "skipped" and every
# point stays UNLABELLED.
semantics = [
    "torch",
    "transformers",
]
# DISK + LightGlue learned matching alone (`ml` already includes it); the
# pipeline falls back to SIFT without it.
matching = [
    "kornia>=0.7.4",
]
# Photographic texture baking (drishti3d.fusion.texture). Without xatlas
# the mesh still exports, with per-vertex colour instead of an atlas.
texture = [
    "xatlas",
]
# Reference-orthophoto/DEM alignment (geometry.reference_align) reads
# GeoTIFFs with rasterio. It was installed by hand and never declared, so
# every exact `uv sync` uninstalled it and reference alignment broke.
reference = [
    "rasterio",
]

[project.scripts]
drishti3d = "drishti3d.app.main:main"
drishti3d-run = "drishti3d.pipeline.runner:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    # Builds the desktop app (packaging/build_app.sh). In the default group
    # so an exact `uv sync` stops uninstalling it between builds.
    "pyinstaller",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drishti3d"]

[tool.hatch.metadata]
allow-direct-references = true
