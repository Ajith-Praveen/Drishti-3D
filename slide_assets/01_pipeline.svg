<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#64748b"/>
    </marker>
    <linearGradient id="novel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <text x="20" y="30" font-size="23" font-weight="700" fill="#0f172a">3CHAKSHU — Processing Pipeline</text>
  <text x="20" y="54" font-size="15" fill="#475569">One drone pass → georeferenced, measurable, confidence-annotated 3D model</text>

  <!-- input -->
  <rect x="20" y="76" width="192" height="66" rx="7" fill="#1e293b"/>
  <text x="116" y="102" font-size="14.5" font-weight="600" fill="#fff" text-anchor="middle">Drone Video (4K)</text>
  <text x="116" y="124" font-size="13" fill="#cbd5e1" text-anchor="middle">+ GPS / IMU / gimbal</text>

  <!-- stages -->
  <g>
    <rect x="248" y="76" width="192" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="344" y="99" font-size="14.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">1 · INGEST</text>
    <text x="344" y="121" font-size="12.5" fill="#475569" text-anchor="middle">decode · telemetry · intrinsics</text>

    <rect x="476" y="76" width="192" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="572" y="99" font-size="14.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">2 · TRIAGE</text>
    <text x="572" y="121" font-size="12.5" fill="#475569" text-anchor="middle">GPS-baseline keyframes</text>

    <rect x="704" y="76" width="192" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="800" y="99" font-size="14.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">3 · GEOMETRY</text>
    <text x="800" y="121" font-size="12.5" fill="#475569" text-anchor="middle">MapAnything · submaps</text>

    <rect x="932" y="76" width="192" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="1028" y="99" font-size="14.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">4 · MATCHING</text>
    <text x="1028" y="121" font-size="12.5" fill="#475569" text-anchor="middle">SIFT · tracks · triangulate</text>
  </g>

  <line x1="212" y1="109" x2="242" y2="109" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="440" y1="109" x2="470" y2="109" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="668" y1="109" x2="698" y2="109" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="896" y1="109" x2="926" y2="109" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/>

  <path d="M1124,142 L1124,168 L116,168 L116,196" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/>

  <g>
    <rect x="20" y="200" width="192" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="116" y="223" font-size="14.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">5 · BUNDLE ADJ.</text>
    <text x="116" y="245" font-size="12.5" fill="#475569" text-anchor="middle">GPS + gravity priors</text>

    <rect x="248" y="200" width="192" height="66" rx="7" fill="url(#novel)" stroke="#d97706" stroke-width="2.2"/>
    <text x="344" y="223" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="middle">6 · COVARIANCE</text>
    <text x="344" y="245" font-size="12.5" fill="#78350f" text-anchor="middle">per-point uncertainty</text>

    <rect x="476" y="200" width="192" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="572" y="223" font-size="14.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">7 · FUSION</text>
    <text x="572" y="245" font-size="12.5" fill="#475569" text-anchor="middle">confidence-weighted TSDF</text>

    <rect x="704" y="200" width="192" height="66" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="800" y="223" font-size="14.5" font-weight="600" fill="#1e3a8a" text-anchor="middle">8 · EXPORT</text>
    <text x="800" y="245" font-size="12.5" fill="#475569" text-anchor="middle">mesh · raster · report</text>

    <rect x="932" y="200" width="192" height="66" rx="7" fill="#1e293b"/>
    <text x="1028" y="223" font-size="14.5" font-weight="600" fill="#fff" text-anchor="middle">Desktop Viewer</text>
    <text x="1028" y="245" font-size="12.5" fill="#cbd5e1" text-anchor="middle">offline · measurable</text>
  </g>

  <line x1="212" y1="233" x2="242" y2="233" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="440" y1="233" x2="470" y2="233" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="668" y1="233" x2="698" y2="233" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="896" y1="233" x2="926" y2="233" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- outputs -->
  <rect x="20" y="300" width="1104" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="325" font-size="14" font-weight="700" fill="#0f172a">OUTPUTS</text>
  <g font-size="13" fill="#334155">
    <text x="40" y="349">3D Mesh — OBJ · PLY · GLB</text>
    <text x="330" y="349">Point Cloud — LAS (+ confidence)</text>
    <text x="660" y="349">Georeferenced — DSM · Orthomosaic (GeoTIFF)</text>
    <text x="40" y="372">Accuracy report card</text>
    <text x="330" y="372">Uncertainty raster</text>
    <text x="660" y="372">Corrective flight-line recommendation</text>
  </g>

  <!-- key insight -->
  <rect x="20" y="404" width="1104" height="74" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="40" y="429" font-size="14" font-weight="700" fill="#78350f">KEY DESIGN DECISION</text>
  <text x="40" y="452" font-size="13.5" fill="#78350f">Feed-forward models give <tspan font-weight="700">robustness</tspan> where classical SfM fails to converge on a single strip.</text>
  <text x="40" y="470" font-size="13.5" fill="#78350f">Bundle adjustment gives <tspan font-weight="700">accuracy</tspan> the model cannot. Stage 3 initialises · Stage 5 refines · Neither alone suffices.</text>

  <!-- footnote -->
  <rect x="20" y="496" width="1104" height="46" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
  <text x="40" y="516" font-size="13" font-weight="700" fill="#991b1b">Stage 6 is our contribution —</text>
  <text x="245" y="516" font-size="13" fill="#7f1d1d">covariance from bundle adjustment becomes a per-point uncertainty ellipsoid,</text>
  <text x="40" y="534" font-size="13" fill="#7f1d1d">which drives the trust layer, gates the measurement tools, and is inverted to plan the corrective flight line.</text>
</svg>
