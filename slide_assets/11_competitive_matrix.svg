<rect x="20" y="404" width="544" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="40" y="428" font-size="13.5" font-weight="700" fill="#14532d">The three highlighted rows are ours alone</text>
<text x="40" y="450" font-size="12.5" fill="#166534">No commercial or research system currently ships a per-vertex</text>
<text x="40" y="468" font-size="12.5" fill="#166534">trust layer, corrective flight planning, or honest accuracy split.</text>

<rect x="580" y="404" width="544" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
