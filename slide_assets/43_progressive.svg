<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#0f172a"/></marker>
<linearGradient id="tl" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#dc2626"/><stop offset="45%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#16a34a"/>
</linearGradient>
</defs>
<rect width="800" height="600" fill="#f8fafc"/>

<text x="400" y="34" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Progressive Reconstruction</text>
<text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">geometry appears while processing continues</text>

<!-- THREE VIEWPORT STATES -->
<g>
<!-- state 1 -->
<rect x="30" y="80" width="230" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
<rect x="30" y="80" width="230" height="22" rx="8" fill="#1e293b"/>
<circle cx="44" cy="91" r="3.5" fill="#f59e0b"/>
<text x="60" y="95" font-size="11" fill="#cbd5e1">processing…</text>
<g opacity="0.95">
<path d="M60,200 L130,178 L200,186 L230,198 L230,216 L60,216 z" fill="#334155"/>
<circle cx="96" cy="192" r="2" fill="#64748b"/><circle cx="140" cy="184" r="2" fill="#64748b"/>
<circle cx="186" cy="188" r="2" fill="#64748b"/>
</g>
<rect x="46" y="112" width="90" height="16" rx="4" fill="#422006"/>
<text x="91" y="124" font-size="10" fill="#fbbf24" text-anchor="middle">window 1 / 6</text>

<!-- state 2 -->
<rect x="285" y="80" width="230" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
<rect x="285" y="80" width="230" height="22" rx="8" fill="#1e293b"/>
<circle cx="299" cy="91" r="3.5" fill="#f59e0b"/>
<text x="315" y="95" font-size="11" fill="#cbd5e1">processing…</text>
<g>
<path d="M305,206 L360,180 L420,190 L470,172 L495,188 L495,216 L305,216 z" fill="#475569"/>
<path d="M352,182 L378,166 L402,174 L402,194 L352,198 z" fill="#64748b"/>
<path d="M432,182 L458,170 L478,178 L478,196 L432,200 z" fill="#64748b"/>
</g>
<rect x="301" y="112" width="90" height="16" rx="4" fill="#422006"/>
<text x="346" y="124" font-size="10" fill="#fbbf24" text-anchor="middle">window 4 / 6</text>

<!-- state 3 -->
<rect x="540" y="80" width="230" height="150" rx="8" fill="#0f172a" stroke="#16a34a" stroke-width="2.4"/>
<rect x="540" y="80" width="230" height="22" rx="8" fill="#14532d"/>
<circle cx="554" cy="91" r="3.5" fill="#4ade80"/>
<text x="570" y="95" font-size="11" fill="#bbf7d0">complete</text>
<g>
<path d="M556,208 L610,178 L672,188 L724,168 L752,186 L752,216 L556,216 z" fill="#16a34a"/>
<path d="M604,180 L632,162 L658,172 L658,192 L604,196 z" fill="#16a34a"/>
<path d="M686,180 L712,166 L736,176 L736,194 L686,198 z" fill="#f59e0b"/>
<path d="M736,176 L752,186 L752,200 L736,194 z" fill="#dc2626"/>
</g>
<rect x="556" y="112" width="104" height="16" rx="4" fill="#052e16"/>
<text x="608" y="124" font-size="10" fill="#86efac" text-anchor="middle">trust layer applied</text>
</g>

<g stroke="#0f172a" stroke-width="2">
<line x1="262" y1="155" x2="281" y2="155" marker-end="url(#ap)"/>
<line x1="517" y1="155" x2="536" y2="155" marker-end="url(#ap)"/>
</g>

<!-- TIMELINE -->
<rect x="60" y="266" width="680" height="12" rx="6" fill="url(#tl)"/>
<g font-size="12" fill="#334155" text-anchor="middle">
<circle cx="60" cy="272" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/>
<text x="60" y="300" font-weight="700">0</text><text x="60" y="316">start</text>
<circle cx="230" cy="272" r="7" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
<text x="230" y="300" font-weight="700">first geometry</text><text x="230" y="316">coarse model on screen</text>
<circle cx="480" cy="272" r="7" fill="#eab308" stroke="#fff" stroke-width="2"/>
<text x="480" y="300" font-weight="700">refining</text><text x="480" y="316">detail fills in, window by window</text>
<circle cx="740" cy="272" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
<text x="700" y="300" font-weight="700">complete</text><text x="700" y="316">measurable + exportable</text>
</g>

<!-- WHY IT MATTERS -->
<text x="400" y="366" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Why this matters</text>

<rect x="30" y="382" width="235" height="112" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="147" y="410" font-size="30" text-anchor="middle">⏱</text>
<text x="147" y="438" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Situational awareness</text>
<text x="147" y="460" font-size="12.5" fill="#1e40af" text-anchor="middle">usable geometry before</text>
<text x="147" y="478" font-size="12.5" fill="#1e40af" text-anchor="middle">the run finishes</text>

<rect x="283" y="382" width="235" height="112" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="400" y="410" font-size="30" text-anchor="middle">🔍</text>
<text x="400" y="438" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">Abort early</text>
<text x="400" y="460" font-size="12.5" fill="#92400e" text-anchor="middle">bad capture is visible in</text>
<text x="400" y="478" font-size="12.5" fill="#92400e" text-anchor="middle">seconds, not after hours</text>

<rect x="536" y="382" width="234" height="112" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="653" y="410" font-size="30" text-anchor="middle">✈</text>
<text x="653" y="438" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Still on site</text>
<text x="653" y="460" font-size="12.5" fill="#166534" text-anchor="middle">refly while the drone</text>
<text x="653" y="478" font-size="12.5" fill="#166534" text-anchor="middle">is still in the field</text>

<!-- FOOTER -->
<rect x="30" y="510" width="740" height="68" rx="9" fill="#1e293b"/>
<text x="400" y="538" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle">ADDRESSES PS CHALLENGE 6</text>
<text x="400" y="562" font-size="14.5" fill="#e2e8f0" text-anchor="middle">"Real-time or near-real-time processing requirements"</text>
</svg>
