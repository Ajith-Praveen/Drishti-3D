<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#0f172a"/></marker>
</defs>
<rect width="800" height="600" fill="#f8fafc"/>

<!-- TOP: everyone else vs us -->
<rect x="24" y="20" width="360" height="180" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="204" y="46" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">EVERY OTHER SYSTEM</text>
<g>
<path d="M70,150 L140,110 L210,120 L290,100 L340,130 L340,170 L70,170 z" fill="#94a3b8"/>
<path d="M70,150 L140,110 L210,120 L290,100 L340,130" fill="none" stroke="#64748b" stroke-width="2"/>
</g>
<text x="204" y="192" font-size="13.5" fill="#991b1b" text-anchor="middle">one undifferentiated mesh</text>

<rect x="416" y="20" width="360" height="180" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="596" y="46" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">3CHAKSHU</text>
<g>
<path d="M462,150 L532,110 L602,120 L602,170 L462,170 z" fill="#16a34a"/>
<path d="M602,120 L682,100 L712,116 L712,170 L602,170 z" fill="#f59e0b"/>
<path d="M712,116 L732,130 L732,170 L712,170 z" fill="#dc2626"/>
<path d="M462,150 L532,110 L602,120 L682,100 L732,130" fill="none" stroke="#0f172a" stroke-width="2"/>
</g>
<text x="596" y="192" font-size="13.5" font-weight="600" fill="#14532d" text-anchor="middle">every surface labelled by reliability</text>

<!-- MIDDLE: the mechanism -->
<text x="400" y="234" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Where the reliability comes from</text>

<g>
<rect x="30" y="250" width="164" height="66" rx="8" fill="#1e293b"/>
<text x="112" y="278" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Bundle</text>
<text x="112" y="298" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">adjustment</text>

<rect x="222" y="250" width="164" height="66" rx="8" fill="#b45309"/>
<text x="304" y="278" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Covariance</text>
<text x="304" y="298" font-size="13" fill="#fde68a" text-anchor="middle">free by-product</text>

<rect x="414" y="250" width="164" height="66" rx="8" fill="#b45309"/>
<text x="496" y="272" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Uncertainty</text>
<text x="496" y="291" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">ellipsoid</text>
<ellipse cx="496" cy="307" rx="5" ry="12" fill="none" stroke="#fde68a" stroke-width="2"/>

<rect x="606" y="250" width="164" height="66" rx="8" fill="#16a34a"/>
<text x="688" y="278" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Trust tier</text>
<text x="688" y="298" font-size="13" fill="#dcfce7" text-anchor="middle">per vertex</text>
</g>
<g stroke="#0f172a" stroke-width="2">
<line x1="194" y1="283" x2="216" y2="283" marker-end="url(#an)"/>
<line x1="386" y1="283" x2="408" y2="283" marker-end="url(#an)"/>
<line x1="578" y1="283" x2="600" y2="283" marker-end="url(#an)"/>
</g>

<!-- REFLY -->
<rect x="24" y="336" width="360" height="150" rx="9" fill="#fff" stroke="#d97706" stroke-width="2"/>
<text x="204" y="360" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">INVERT IT → CORRECTIVE PASS</text>
<line x1="52" y1="400" x2="356" y2="400" stroke="#dc2626" stroke-width="3"/>
<text x="204" y="392" font-size="12" fill="#7f1d1d" text-anchor="middle">original pass</text>
<ellipse cx="204" cy="438" rx="11" ry="30" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 3"/>
<circle cx="204" cy="438" r="5" fill="#dc2626"/>
<line x1="56" y1="476" x2="352" y2="410" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 4"/>
<text x="204" y="472" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">recommended line</text>

<!-- HONEST ACCURACY -->
<rect x="416" y="336" width="360" height="150" rx="9" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="596" y="360" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">TWO ACCURACIES, REPORTED APART</text>
<g font-size="13.5">
<rect x="440" y="374" width="312" height="28" fill="#1e293b"/>
<text x="452" y="393" font-weight="700" fill="#fff">Accuracy</text>
<text x="620" y="393" font-weight="700" fill="#fff">GPS</text>
<text x="700" y="393" font-weight="700" fill="#fff">RTK</text>
<rect x="440" y="402" width="312" height="28" fill="#f8fafc"/>
<text x="452" y="421" fill="#0f172a">Relative</text>
<text x="620" y="421" fill="#16a34a" font-weight="700">&lt; 1 m</text>
<text x="700" y="421" fill="#16a34a" font-weight="700">&lt; 1 m</text>
<rect x="440" y="430" width="312" height="28" fill="#fff"/>
<text x="452" y="449" fill="#0f172a">Absolute</text>
<text x="620" y="449" fill="#b91c1c" font-weight="700">2–5 m</text>
<text x="700" y="449" fill="#16a34a" font-weight="700">1–3 cm</text>
</g>
<text x="596" y="474" font-size="12.5" fill="#64748b" text-anchor="middle">GPS bias is a sensor limit, not an algorithm limit</text>

<!-- BOTTOM CLAIM -->
<rect x="24" y="502" width="752" height="76" rx="9" fill="#1e293b"/>
<text x="400" y="532" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">Published: feed-forward reconstruction · bundle adjustment · volumetric fusion</text>
<text x="400" y="560" font-size="15.5" font-weight="700" fill="#fff" text-anchor="middle">Ours: the trust layer, and inverting it into a corrective flight plan</text>
</svg>
