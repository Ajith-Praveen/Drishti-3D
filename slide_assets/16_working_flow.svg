<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="fw" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#334155"/></marker></defs>
<text x="20" y="30" font-size="23" font-weight="700" fill="#0f172a">Working Flow</text>
<text x="20" y="54" font-size="15" fill="#475569">What enters each stage, what leaves it, and which problem-statement challenge it answers</text>

<g font-size="12.5">
<rect x="20" y="72" width="1104" height="30" fill="#1e293b"/>
<text x="34" y="92" font-weight="700" fill="#fff">Stage</text>
<text x="196" y="92" font-weight="700" fill="#fff">Input</text>
<text x="418" y="92" font-weight="700" fill="#fff">Method</text>
<text x="734" y="92" font-weight="700" fill="#fff">Output</text>
<text x="944" y="92" font-weight="700" fill="#fff">Solves</text>

<rect x="20" y="102" width="1104" height="46" fill="#eff6ff"/>
<text x="34" y="122" font-weight="700" fill="#1e3a8a">1 · INGEST</text>
<text x="34" y="139" font-size="11" fill="#64748b">seconds</text>
<text x="196" y="122" fill="#0f172a">Video · GPS · flight log</text>
<text x="196" y="139" font-size="11" fill="#64748b">1080p / 4K</text>
<text x="418" y="122" fill="#334155">Decode, parse telemetry, auto-sync</text>
<text x="418" y="139" font-size="11" fill="#64748b">resolve camera intrinsics</text>
<text x="734" y="130" fill="#334155">Time-aligned frames</text>
<text x="944" y="130" fill="#0369a1">Mandatory inputs</text>

<rect x="20" y="148" width="1104" height="46" fill="#f8fafc"/>
<text x="34" y="168" font-weight="700" fill="#1e3a8a">2 · SELECT</text>
<text x="34" y="185" font-size="11" fill="#64748b">seconds</text>
<text x="196" y="168" fill="#0f172a">~18,000 frames</text>
<text x="196" y="185" font-size="11" fill="#64748b">mostly near-duplicates</text>
<text x="418" y="168" fill="#334155">Spacing by GPS baseline in metres,</text>
<text x="418" y="185" font-size="11" fill="#64748b">altitude-scaled · sharpest-in-window</text>
<text x="734" y="176" fill="#334155">A few hundred keyframes</text>
<text x="944" y="168" fill="#b45309">Motion blur</text>
<text x="944" y="185" fill="#b45309">Processing time</text>

<rect x="20" y="194" width="1104" height="46" fill="#eff6ff"/>
<text x="34" y="214" font-weight="700" fill="#1e3a8a">3 · RECONSTRUCT</text>
<text x="34" y="231" font-size="11" fill="#64748b">minutes</text>
<text x="196" y="214" fill="#0f172a">Keyframes + GPS + K</text>
<text x="196" y="231" font-size="11" fill="#64748b">as model conditioning</text>
<text x="418" y="214" fill="#334155">Pose-free feed-forward model,</text>
<text x="418" y="231" font-size="11" fill="#64748b">overlapping windows → submaps</text>
<text x="734" y="222" fill="#334155">Poses + dense geometry</text>
<text x="944" y="222" fill="#b45309">Limited viewing angles</text>

<rect x="20" y="240" width="1104" height="46" fill="#f8fafc"/>
<text x="34" y="260" font-weight="700" fill="#1e3a8a">4 · REFINE</text>
<text x="34" y="277" font-size="11" fill="#64748b">minutes</text>
<text x="196" y="260" fill="#0f172a">Poses + correspondences</text>
<text x="196" y="277" font-size="11" fill="#64748b">multi-view tracks</text>
<text x="418" y="260" fill="#334155">Bundle adjustment with GPS position</text>
<text x="418" y="277" font-size="11" fill="#64748b">priors + gravity prior + gauge fixing</text>
<text x="734" y="268" fill="#334155">Metric, levelled poses</text>
<text x="944" y="260" fill="#b45309">Metric accuracy, no GCP</text>
<text x="944" y="277" fill="#b45309">GPS &amp; sensor noise</text>

<rect x="20" y="286" width="1104" height="46" fill="#fef3c7"/>
<text x="34" y="306" font-weight="700" fill="#78350f">5 · QUANTIFY</text>
<text x="34" y="323" font-size="11" fill="#92400e">seconds</text>
<text x="196" y="306" fill="#0f172a" font-weight="600">Normal equations from ➍</text>
<text x="196" y="323" font-size="11" fill="#92400e">already computed</text>
<text x="418" y="306" fill="#78350f" font-weight="600">Schur complement → 3×3 covariance</text>
<text x="418" y="323" font-size="11" fill="#92400e">→ uncertainty ellipsoid per point</text>
<text x="734" y="314" fill="#78350f" font-weight="600">Per-vertex trust tier</text>
<text x="944" y="314" fill="#b45309">Occluded surfaces</text>

<rect x="20" y="332" width="1104" height="46" fill="#f8fafc"/>
<text x="34" y="352" font-weight="700" fill="#1e3a8a">6 · FUSE</text>
<text x="34" y="369" font-size="11" fill="#64748b">minutes</text>
<text x="196" y="352" fill="#0f172a">Depth + confidence</text>
<text x="418" y="352" fill="#334155">Confidence-weighted volumetric fusion;</text>
<text x="418" y="369" font-size="11" fill="#64748b">dynamic objects masked out</text>
<text x="734" y="360" fill="#334155">Textured mesh + cloud</text>
<text x="944" y="352" fill="#b45309">Dynamic objects</text>
<text x="944" y="369" fill="#b45309">Illumination variation</text>

<rect x="20" y="378" width="1104" height="46" fill="#f0fdf4"/>
<text x="34" y="398" font-weight="700" fill="#14532d">7 · DELIVER</text>
<text x="34" y="415" font-size="11" fill="#166534">seconds</text>
<text x="196" y="398" fill="#0f172a">Georeferenced model</text>
<text x="418" y="398" fill="#334155">Export + accuracy report + corrective</text>
<text x="418" y="415" font-size="11" fill="#166534">flight-line recommendation</text>
<text x="734" y="398" fill="#334155">OBJ·PLY·GLB·LAS·GeoTIFF</text>
<text x="734" y="415" font-size="11" fill="#166534">+ report + refly plan</text>
<text x="944" y="406" fill="#0369a1">Visualization · measurement</text>
</g>

<!-- key insight strip -->
<rect x="20" y="440" width="1104" height="76" rx="8" fill="#1e293b"/>
<text x="40" y="466" font-size="14" font-weight="700" fill="#fbbf24">THE ARCHITECTURAL IDEA</text>
<text x="40" y="490" font-size="13.5" fill="#e2e8f0">Stage ➌ gives <tspan font-weight="700" fill="#fff">robustness</tspan> where classical photogrammetry cannot converge on a single strip.</text>
<text x="40" y="509" font-size="13.5" fill="#e2e8f0">Stage ➍ gives <tspan font-weight="700" fill="#fff">accuracy</tspan> the model alone cannot. Stage ➎ costs almost nothing — the uncertainty is a by-product of ➍.</text>

<!-- evidence -->
<rect x="20" y="526" width="544" height="118" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="40" y="550" font-size="13.5" font-weight="700" fill="#14532d">Published evidence for stage ➌</text>
<text x="40" y="574" font-size="12.5" fill="#166534">Feed-forward reconstruction achieves <tspan font-weight="700">+50% completeness</tspan></text>
<text x="40" y="592" font-size="12.5" fill="#166534">over COLMAP on sparse aerial input</text>
<text x="40" y="608" font-size="11" fill="#15803d">Wu, Landgraf, Ulrich &amp; Qin — arXiv:2507.14798</text>
<text x="40" y="632" font-size="12.5" fill="#166534">UAV domain adaptation cuts Ray Error <tspan font-weight="700">84.2%</tspan>, ATE <tspan font-weight="700">76.0%</tspan></text>

<rect x="580" y="526" width="544" height="118" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="600" y="550" font-size="13.5" font-weight="700" fill="#1e3a8a">Published evidence for the time budget</text>
<text x="600" y="574" font-size="12.5" fill="#1e40af">Coordinate-anchored feed-forward UAV mapping</text>
<text x="600" y="592" font-size="12.5" fill="#1e40af">reconstructs <tspan font-weight="700">2,000 images in ~5 minutes</tspan></text>
<text x="600" y="608" font-size="11" fill="#1d4ed8">Yang et al., GeoFF3D — arXiv:2608.28288</text>
<text x="600" y="632" font-size="12.5" fill="#1e40af">F@5 = <tspan font-weight="700">0.877</tspan> across nine aerial mapping blocks</text>
</svg>
