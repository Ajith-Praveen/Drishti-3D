<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="20" y="30" font-size="23" font-weight="700" fill="#0f172a">Meeting the Problem Statement</text>
<text x="20" y="54" font-size="15" fill="#475569">Every reconstruction target and every named challenge, answered by a specific mechanism</text>

<!-- WHAT TO RECONSTRUCT -->
<text x="20" y="88" font-size="16" font-weight="700" fill="#0f172a">What the system must reconstruct</text>
<g>
<rect x="20" y="98" width="212" height="76" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="126" y="122" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terrain &amp; structures</text>
<text x="126" y="144" font-size="11.5" fill="#475569" text-anchor="middle">Dense metric point cloud</text>
<text x="126" y="161" font-size="11.5" fill="#475569" text-anchor="middle">→ TSDF surface</text>

<rect x="244" y="98" width="212" height="76" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="350" y="122" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Facades &amp; rooftops</text>
<text x="350" y="144" font-size="11.5" fill="#475569" text-anchor="middle">Oblique gimbal geometry;</text>
<text x="350" y="161" font-size="11.5" fill="#475569" text-anchor="middle">unseen sides flagged</text>

<rect x="468" y="98" width="212" height="76" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="574" y="122" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Roads &amp; infrastructure</text>
<text x="574" y="144" font-size="11.5" fill="#475569" text-anchor="middle">Georeferenced DSM +</text>
<text x="574" y="161" font-size="11.5" fill="#475569" text-anchor="middle">orthomosaic (GeoTIFF)</text>

<rect x="692" y="98" width="212" height="76" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="798" y="122" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Vegetation &amp; obstacles</text>
<text x="798" y="144" font-size="11.5" fill="#475569" text-anchor="middle">Semantic classification;</text>
<text x="798" y="161" font-size="11.5" fill="#475569" text-anchor="middle">noisy canopy marked</text>

<rect x="916" y="98" width="208" height="76" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="1020" y="122" font-size="13.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Textured output</text>
<text x="1020" y="144" font-size="11.5" fill="#475569" text-anchor="middle">Mesh or point cloud,</text>
<text x="1020" y="161" font-size="11.5" fill="#475569" text-anchor="middle">colour from keyframes</text>
</g>

<!-- KEY CHALLENGES -->
<text x="20" y="206" font-size="16" font-weight="700" fill="#0f172a">The eight key challenges named in the problem statement</text>
<g font-size="12.5">
<rect x="20" y="216" width="1104" height="28" fill="#1e293b"/>
<text x="36" y="235" font-weight="700" fill="#fff">Challenge</text>
<text x="470" y="235" font-weight="700" fill="#fff">Our mechanism</text>

<rect x="20" y="244" width="1104" height="28" fill="#f8fafc"/>
<text x="36" y="263" fill="#0f172a">1 · Limited viewing angles from a single flight path</text>
<text x="470" y="263" fill="#475569">Pose-free feed-forward init, robust where classical SfM will not converge</text>

<rect x="20" y="272" width="1104" height="28" fill="#fff"/>
<text x="36" y="291" fill="#0f172a">2 · Motion blur and video compression artefacts</text>
<text x="470" y="291" fill="#475569">Sharpness-scored frame selection — the sharpest candidate in each window wins</text>

<rect x="20" y="300" width="1104" height="28" fill="#f8fafc"/>
<text x="36" y="319" fill="#0f172a">3 · Variable illumination and shadows</text>
<text x="470" y="319" fill="#475569">Exposure scoring, colour harmonisation across keyframes before fusion</text>

<rect x="20" y="328" width="1104" height="28" fill="#fff"/>
<text x="36" y="347" fill="#0f172a">4 · Dynamic objects — vehicles, humans, animals</text>
<text x="470" y="347" fill="#475569">Segmentation masks moving objects out before they contaminate the surface</text>

<rect x="20" y="356" width="1104" height="28" fill="#f8fafc"/>
<text x="36" y="375" fill="#0f172a">5 · GPS inaccuracies and sensor noise</text>
<text x="470" y="375" fill="#475569">GPS used as a soft prior in bundle adjustment, not as truth — noise averages out</text>

<rect x="20" y="384" width="1104" height="28" fill="#fff"/>
<text x="36" y="403" fill="#0f172a">6 · Real-time / near-real-time processing</text>
<text x="470" y="403" fill="#475569">Feed-forward inference not iterative SfM; bounded resolution; progressive output</text>

<rect x="20" y="412" width="1104" height="28" fill="#f8fafc"/>
<text x="36" y="431" fill="#0f172a">7 · Reconstruction of occluded surfaces</text>
<text x="470" y="431" fill="#475569">Plane and symmetry completion, explicitly marked as inferred — never silent</text>

<rect x="20" y="440" width="1104" height="28" fill="#fff"/>
<text x="36" y="459" fill="#0f172a">8 · Metric accuracy without extensive GCPs</text>
<text x="470" y="459" fill="#475569">GPS + gravity + scale priors fused in one bundle adjustment; RTK/PPK when available</text>
</g>

<!-- OUTPUT SPEC -->
<text x="20" y="500" font-size="16" font-weight="700" fill="#0f172a">Desired output specification</text>
<g font-size="12.5">
<rect x="20" y="510" width="1104" height="28" fill="#1e293b"/>
<text x="36" y="529" font-weight="700" fill="#fff">Parameter</text>
<text x="330" y="529" font-weight="700" fill="#fff">Target</text>
<text x="700" y="529" font-weight="700" fill="#fff">Our approach</text>

<rect x="20" y="538" width="1104" height="26" fill="#f8fafc"/>
<text x="36" y="556" fill="#0f172a">Reconstruction type</text>
<text x="330" y="556" fill="#475569">3D mesh / point cloud</text>
<text x="700" y="556" fill="#1e40af">Both — TSDF mesh and dense cloud</text>

<rect x="20" y="564" width="1104" height="26" fill="#fff"/>
<text x="36" y="582" fill="#0f172a">Spatial accuracy</text>
<text x="330" y="582" fill="#475569">≤ 1 m</text>
<text x="700" y="582" fill="#1e40af">Bundle adjustment with GPS + gravity priors</text>

<rect x="20" y="590" width="1104" height="26" fill="#f8fafc"/>
<text x="36" y="608" fill="#0f172a">Processing time</text>
<text x="330" y="608" fill="#475569">&lt; 15 min for a 10-min video</text>
<text x="700" y="608" fill="#1e40af">Keyframe reduction + feed-forward inference</text>

<rect x="20" y="616" width="1104" height="26" fill="#fff"/>
<text x="36" y="634" fill="#0f172a">Output formats · Visualization</text>
<text x="330" y="634" fill="#475569">OBJ, PLY, LAS, GeoTIFF, GLB · viewer</text>
<text x="700" y="634" fill="#1e40af">All formats + native offline desktop viewer</text>
</g>
</svg>
