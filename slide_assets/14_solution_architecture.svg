<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="aa" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#0f172a"/></marker>
</defs>
<text x="20" y="30" font-size="24" font-weight="700" fill="#0f172a">Solution Architecture</text>
<text x="20" y="55" font-size="15" fill="#475569">Four layers. Each exists because a specific property of single-pass flight demands it.</text>

<!-- INPUT -->
<rect x="20" y="74" width="180" height="540" rx="9" fill="#1e293b"/>
<text x="110" y="102" font-size="14" font-weight="700" fill="#fbbf24" text-anchor="middle">INPUT</text>
<line x1="44" y1="112" x2="176" y2="112" stroke="#475569"/>
<text x="110" y="140" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Single-pass video</text>
<text x="110" y="160" font-size="11.5" fill="#94a3b8" text-anchor="middle">1080p / 4K</text>
<text x="110" y="192" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">GPS track</text>
<text x="110" y="212" font-size="11.5" fill="#94a3b8" text-anchor="middle">2–5 m absolute</text>
<text x="110" y="244" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Flight metadata</text>
<text x="110" y="264" font-size="11.5" fill="#94a3b8" text-anchor="middle">gimbal, altitude</text>
<text x="110" y="300" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">optional</text>
<text x="110" y="322" font-size="12" fill="#94a3b8" text-anchor="middle">IMU · barometer</text>
<text x="110" y="342" font-size="12" fill="#94a3b8" text-anchor="middle">intrinsics · RTK/PPK</text>

<rect x="44" y="378" width="132" height="216" rx="6" fill="#0f172a"/>
<text x="110" y="402" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">THE CONSTRAINT</text>
<text x="110" y="426" font-size="11.5" fill="#e2e8f0" text-anchor="middle">Cameras lie on a</text>
<text x="110" y="443" font-size="11.5" fill="#e2e8f0" text-anchor="middle">near-straight line.</text>
<text x="110" y="470" font-size="11.5" fill="#e2e8f0" text-anchor="middle">Depth weakly</text>
<text x="110" y="487" font-size="11.5" fill="#e2e8f0" text-anchor="middle">determined.</text>
<text x="110" y="514" font-size="11.5" fill="#e2e8f0" text-anchor="middle">Roll/pitch barely</text>
<text x="110" y="531" font-size="11.5" fill="#e2e8f0" text-anchor="middle">observable.</text>
<text x="110" y="558" font-size="11.5" fill="#e2e8f0" text-anchor="middle">One side of every</text>
<text x="110" y="575" font-size="11.5" fill="#e2e8f0" text-anchor="middle">structure only.</text>

<line x1="200" y1="340" x2="228" y2="340" stroke="#0f172a" stroke-width="2" marker-end="url(#aa)"/>

<!-- L1 -->
<rect x="236" y="74" width="232" height="540" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<rect x="236" y="74" width="232" height="40" rx="9" fill="#2563eb"/>
<text x="352" y="100" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1 · SELECT</text>
<text x="352" y="138" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Which frames matter?</text>
<text x="256" y="168" font-size="12" fill="#334155">18,000 frames in a 10-min 4K</text>
<text x="256" y="186" font-size="12" fill="#334155">flight. Most are near-duplicates.</text>
<text x="256" y="216" font-size="12.5" font-weight="600" fill="#1e3a8a">Spacing by metric baseline</text>
<text x="256" y="236" font-size="12" fill="#475569">Keyframes spaced by real GPS</text>
<text x="256" y="254" font-size="12" fill="#475569">distance, scaled to altitude —</text>
<text x="256" y="272" font-size="12" fill="#475569">not by a fixed frame stride.</text>
<text x="256" y="302" font-size="12.5" font-weight="600" fill="#1e3a8a">Blur rejection</text>
<text x="256" y="322" font-size="12" fill="#475569">Sharpest candidate in each</text>
<text x="256" y="340" font-size="12" fill="#475569">window; blurred frames never</text>
<text x="256" y="358" font-size="12" fill="#475569">enter the reconstruction.</text>
<rect x="256" y="378" width="192" height="72" rx="6" fill="#dbeafe"/>
<text x="352" y="400" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">WHY IT MATTERS</text>
<text x="352" y="420" font-size="11" fill="#1e40af" text-anchor="middle">This is what makes the</text>
<text x="352" y="436" font-size="11" fill="#1e40af" text-anchor="middle">15-minute budget reachable</text>
<text x="256" y="480" font-size="11.5" font-style="italic" fill="#64748b">Addresses PS challenge 2:</text>
<text x="256" y="498" font-size="11.5" font-style="italic" fill="#64748b">motion blur &amp; compression</text>
<text x="256" y="524" font-size="11.5" font-style="italic" fill="#64748b">Addresses PS challenge 6:</text>
<text x="256" y="542" font-size="11.5" font-style="italic" fill="#64748b">near-real-time processing</text>

<line x1="468" y1="340" x2="496" y2="340" stroke="#0f172a" stroke-width="2" marker-end="url(#aa)"/>

<!-- L2 -->
<rect x="504" y="74" width="232" height="540" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<rect x="504" y="74" width="232" height="40" rx="9" fill="#16a34a"/>
<text x="620" y="100" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2 · RECONSTRUCT</text>
<text x="620" y="138" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Where is everything?</text>
<text x="524" y="168" font-size="12" fill="#334155">Classical SfM needs crossing</text>
<text x="524" y="186" font-size="12" fill="#334155">passes. It will not converge here.</text>
<text x="524" y="216" font-size="12.5" font-weight="600" fill="#14532d">Feed-forward initialisation</text>
<text x="524" y="236" font-size="12" fill="#475569">Pose-free model predicts poses</text>
<text x="524" y="254" font-size="12" fill="#475569">and dense geometry with no</text>
<text x="524" y="272" font-size="12" fill="#475569">prior poses required at all.</text>
<text x="524" y="302" font-size="12.5" font-weight="600" fill="#14532d">Bundle adjustment refines</text>
<text x="524" y="322" font-size="12" fill="#475569">GPS position priors fix scale.</text>
<text x="524" y="340" font-size="12" fill="#475569">Gravity prior fixes tilt that a</text>
<text x="524" y="358" font-size="12" fill="#475569">collinear path cannot resolve.</text>
<rect x="524" y="378" width="192" height="72" rx="6" fill="#dcfce7"/>
<text x="620" y="400" font-size="11.5" font-weight="700" fill="#14532d" text-anchor="middle">WHY IT MATTERS</text>
<text x="620" y="420" font-size="11" fill="#166534" text-anchor="middle">Robustness from the model,</text>
<text x="620" y="436" font-size="11" fill="#166534" text-anchor="middle">accuracy from the optimisation</text>
<text x="524" y="480" font-size="11.5" font-style="italic" fill="#64748b">Addresses PS challenge 1:</text>
<text x="524" y="498" font-size="11.5" font-style="italic" fill="#64748b">limited viewing angles</text>
<text x="524" y="524" font-size="11.5" font-style="italic" fill="#64748b">Addresses PS challenge 8:</text>
<text x="524" y="542" font-size="11.5" font-style="italic" fill="#64748b">metric accuracy without GCPs</text>

<line x1="736" y1="340" x2="764" y2="340" stroke="#0f172a" stroke-width="2" marker-end="url(#aa)"/>

<!-- L3 -->
<rect x="772" y="74" width="232" height="540" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
<rect x="772" y="74" width="232" height="40" rx="9" fill="#d97706"/>
<text x="888" y="100" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3 · QUANTIFY</text>
<text x="888" y="138" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">How much do we know?</text>
<text x="792" y="168" font-size="12" fill="#334155">A single pass cannot see</text>
<text x="792" y="186" font-size="12" fill="#334155">everything. Silence about that</text>
<text x="792" y="204" font-size="12" fill="#334155">is the dangerous part.</text>
<text x="792" y="234" font-size="12.5" font-weight="600" fill="#78350f">Covariance → ellipsoid</text>
<text x="792" y="254" font-size="12" fill="#475569">The same bundle adjustment</text>
<text x="792" y="272" font-size="12" fill="#475569">yields a per-point uncertainty</text>
<text x="792" y="290" font-size="12" fill="#475569">ellipsoid, nearly for free.</text>
<text x="792" y="318" font-size="12.5" font-weight="600" fill="#78350f">Trust tier per vertex</text>
<text x="792" y="338" font-size="12" fill="#475569">MEASURED · LOW · INFERRED,</text>
<text x="792" y="356" font-size="12" fill="#475569">carried into every export.</text>
<rect x="792" y="378" width="192" height="72" rx="6" fill="#fef3c7"/>
<text x="888" y="400" font-size="11.5" font-weight="700" fill="#78350f" text-anchor="middle">OUR CONTRIBUTION</text>
<text x="888" y="420" font-size="11" fill="#92400e" text-anchor="middle">No existing system reports</text>
<text x="888" y="436" font-size="11" fill="#92400e" text-anchor="middle">per-vertex reliability</text>
<text x="792" y="480" font-size="11.5" font-style="italic" fill="#64748b">Addresses PS challenge 7:</text>
<text x="792" y="498" font-size="11.5" font-style="italic" fill="#64748b">occluded surfaces</text>
<text x="792" y="524" font-size="11.5" font-style="italic" fill="#64748b">Addresses PS challenge 5:</text>
<text x="792" y="542" font-size="11.5" font-style="italic" fill="#64748b">GPS &amp; sensor noise</text>

<line x1="1004" y1="340" x2="1032" y2="340" stroke="#0f172a" stroke-width="2" marker-end="url(#aa)"/>

<!-- L4 -->
<rect x="1040" y="74" width="184" height="540" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="1040" y="74" width="184" height="40" rx="9" fill="#7c3aed"/>
<text x="1132" y="100" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4 · DELIVER</text>
<text x="1132" y="138" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">Usable by whom?</text>
<text x="1058" y="170" font-size="12.5" font-weight="600" fill="#5b21b6">Models</text>
<text x="1058" y="190" font-size="12" fill="#475569">OBJ · PLY · GLB</text>
<text x="1058" y="216" font-size="12.5" font-weight="600" fill="#5b21b6">Point cloud</text>
<text x="1058" y="236" font-size="12" fill="#475569">LAS + confidence</text>
<text x="1058" y="262" font-size="12.5" font-weight="600" fill="#5b21b6">Georeferenced</text>
<text x="1058" y="282" font-size="12" fill="#475569">DSM · orthomosaic</text>
<text x="1058" y="300" font-size="12" fill="#475569">GeoTIFF</text>
<text x="1058" y="326" font-size="12.5" font-weight="600" fill="#5b21b6">Accuracy report</text>
<text x="1058" y="346" font-size="12" fill="#475569">relative vs absolute</text>
<text x="1058" y="372" font-size="12.5" font-weight="600" fill="#5b21b6">Refly plan</text>
<text x="1058" y="392" font-size="12" fill="#475569">heading · altitude</text>
<text x="1058" y="410" font-size="12" fill="#475569">gimbal angle</text>
<rect x="1058" y="428" width="148" height="70" rx="6" fill="#ede9fe"/>
<text x="1132" y="450" font-size="11.5" font-weight="700" fill="#5b21b6" text-anchor="middle">OFFLINE VIEWER</text>
<text x="1132" y="470" font-size="11" fill="#6d28d9" text-anchor="middle">Native desktop.</text>
<text x="1132" y="486" font-size="11" fill="#6d28d9" text-anchor="middle">Measure · analyse.</text>
<text x="1058" y="524" font-size="11.5" font-style="italic" fill="#64748b">Visualization,</text>
<text x="1058" y="542" font-size="11.5" font-style="italic" fill="#64748b">measurement, analysis</text>
<text x="1058" y="560" font-size="11.5" font-style="italic" fill="#64748b">— as the PS requires</text>

<text x="20" y="640" font-size="13.5" fill="#334155">Adaptive quality modes share one pipeline: a rapid coarse pass for immediate situational awareness, and a full-resolution pass for analysis-grade output.</text>
</svg>
