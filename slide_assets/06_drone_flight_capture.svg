<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#dbeafe"/><stop offset="60%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#f8fafc"/>
  </linearGradient>
  <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d9cfc0"/><stop offset="100%" stop-color="#bfae99"/>
  </linearGradient>
  <linearGradient id="roofSeen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4ade80"/><stop offset="100%" stop-color="#16a34a"/>
  </linearGradient>
  <linearGradient id="wallUnseen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/>
  </linearGradient>
  <linearGradient id="frust" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2563eb" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#2563eb" stop-opacity="0.06"/>
  </linearGradient>
  <marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0,4 L8,1 L8,7 z" fill="#0f172a"/>
  </marker>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.25"/>
  </filter>
</defs>

<text x="20" y="30" font-size="23" font-weight="700" fill="#0f172a">Single-Pass Capture Geometry</text>
<text x="20" y="54" font-size="15" fill="#475569">One straight flight line. Drawn to the real proportions of a 120 m survey pass.</text>

<!-- SCENE -->
<rect x="20" y="70" width="1200" height="330" rx="8" fill="url(#skyG)" stroke="#cbd5e1"/>

<!-- altitude dimension -->
<line x1="62" y1="140" x2="62" y2="330" stroke="#0f172a" stroke-width="1.3" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="54" y="240" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="end">120 m</text>
<text x="54" y="256" font-size="11" fill="#64748b" text-anchor="end">AGL</text>

<!-- flight line -->
<line x1="120" y1="140" x2="1180" y2="140" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="10 5"/>
<text x="120" y="128" font-size="12" font-weight="600" fill="#1d4ed8">flight line — single pass, no crossing tracks</text>

<!-- frustums: heavy overlap -->
<g>
  <path d="M300,146 L120,330 L516,330 z" fill="url(#frust)" stroke="#2563eb" stroke-width="0.9" stroke-opacity="0.55"/>
  <path d="M420,146 L240,330 L636,330 z" fill="url(#frust)" stroke="#2563eb" stroke-width="0.9" stroke-opacity="0.55"/>
  <path d="M540,146 L360,330 L756,330 z" fill="url(#frust)" stroke="#2563eb" stroke-width="0.9" stroke-opacity="0.55"/>
  <path d="M660,146 L480,330 L876,330 z" fill="url(#frust)" stroke="#2563eb" stroke-width="0.9" stroke-opacity="0.55"/>
  <path d="M780,146 L600,330 L996,330 z" fill="url(#frust)" stroke="#2563eb" stroke-width="0.9" stroke-opacity="0.55"/>
  <path d="M900,146 L720,330 L1116,330 z" fill="url(#frust)" stroke="#2563eb" stroke-width="0.9" stroke-opacity="0.55"/>
</g>

<!-- drones -->
<g filter="url(#soft)">
  <g id="d1" transform="translate(300,140)">
    <ellipse cx="-26" cy="-8" rx="15" ry="2.6" fill="#94a3b8"/><ellipse cx="26" cy="-8" rx="15" ry="2.6" fill="#94a3b8"/>
    <line x1="-22" y1="-6" x2="-8" y2="0" stroke="#334155" stroke-width="2.6"/><line x1="22" y1="-6" x2="8" y2="0" stroke="#334155" stroke-width="2.6"/>
    <rect x="-11" y="-4" width="22" height="9" rx="3" fill="#1e293b"/>
    <rect x="-3.5" y="4" width="7" height="6" rx="1.6" fill="#0f172a"/>
    <circle cx="0" cy="9.5" r="2.4" fill="#38bdf8"/>
  </g>
  <use href="#d1" x="120"/><use href="#d1" x="240"/><use href="#d1" x="360"/><use href="#d1" x="480"/><use href="#d1" x="600"/>
</g>

<!-- baseline dimension -->
<line x1="300" y1="112" x2="420" y2="112" stroke="#0f172a" stroke-width="1.3" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="360" y="106" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">7.7 m</text>
<text x="360" y="93" font-size="11" fill="#64748b" text-anchor="middle">keyframe baseline</text>

<!-- ground -->
<rect x="20" y="330" width="1200" height="70" fill="url(#groundG)"/>
<line x1="20" y1="330" x2="1220" y2="330" stroke="#8a7a66" stroke-width="1.6"/>

<!-- buildings: seen roof + one wall, opposite wall unseen -->
<g>
  <!-- b1 -->
  <path d="M250,330 L250,296 L298,286 L298,320 z" fill="#a8a29e"/>
  <path d="M298,320 L298,286 L342,296 L342,330 z" fill="url(#wallUnseen)"/>
  <path d="M250,296 L298,286 L342,296 L294,306 z" fill="url(#roofSeen)"/>
  <!-- b2 -->
  <path d="M560,330 L560,290 L604,278 L604,318 z" fill="#a8a29e"/>
  <path d="M604,318 L604,278 L652,290 L652,330 z" fill="url(#wallUnseen)"/>
  <path d="M560,290 L604,278 L652,290 L608,302 z" fill="url(#roofSeen)"/>
  <!-- b3 -->
  <path d="M880,330 L880,300 L920,291 L920,321 z" fill="#a8a29e"/>
  <path d="M920,321 L920,291 L962,300 L962,330 z" fill="url(#wallUnseen)"/>
  <path d="M880,300 L920,291 L962,300 L922,309 z" fill="url(#roofSeen)"/>
</g>
<!-- trees -->
<g fill="#4d7c0f">
  <circle cx="430" cy="320" r="9"/><circle cx="443" cy="325" r="6.5"/>
  <circle cx="740" cy="322" r="8"/><circle cx="1050" cy="319" r="10"/>
</g>
<!-- road -->
<path d="M20,352 Q400,344 1220,356" stroke="#78716c" stroke-width="7" fill="none" opacity="0.85"/>

<!-- footprint dimension -->
<line x1="360" y1="376" x2="756" y2="376" stroke="#0f172a" stroke-width="1.3" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="558" y="392" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">216 m ground footprint per frame</text>

<!-- legend -->
<rect x="988" y="196" width="220" height="76" rx="6" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1"/>
<rect x="1000" y="208" width="14" height="11" rx="2" fill="url(#roofSeen)"/>
<text x="1022" y="218" font-size="11.5" fill="#14532d">observed — roof &amp; near wall</text>
<rect x="1000" y="228" width="14" height="11" rx="2" fill="url(#wallUnseen)"/>
<text x="1022" y="238" font-size="11.5" fill="#7f1d1d">never observed — far wall</text>
<rect x="1000" y="248" width="14" height="11" rx="2" fill="#2563eb" fill-opacity="0.3"/>
<text x="1022" y="258" font-size="11.5" fill="#1e3a8a">camera field of view</text>

<!-- CONSEQUENCES -->
<text x="20" y="432" font-size="16" font-weight="700" fill="#0f172a">What this geometry implies</text>

<rect x="20" y="444" width="386" height="128" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="40" y="468" font-size="13.5" font-weight="700" fill="#1e3a8a">Overlap is not the problem</text>
<text x="40" y="492" font-size="12.5" fill="#334155">Baseline 7.7 m against a 122 m along-track</text>
<text x="40" y="510" font-size="12.5" fill="#334155">footprint gives <tspan font-weight="700">93.6% forward overlap</tspan> —</text>
<text x="40" y="528" font-size="12.5" fill="#334155">more than the 80% survey standard.</text>
<text x="40" y="552" font-size="12.5" font-weight="600" fill="#1e3a8a">Every ground point is seen many times.</text>

<rect x="426" y="444" width="386" height="128" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="446" y="468" font-size="13.5" font-weight="700" fill="#7f1d1d">Baseline-to-height ratio is</text>
<text x="446" y="492" font-size="12.5" fill="#334155">B/H = 7.7 / 120 = <tspan font-weight="700">0.064</tspan></text>
<text x="446" y="510" font-size="12.5" fill="#334155">Triangulation angle ≈ <tspan font-weight="700">3.7°</tspan> between</text>
<text x="446" y="528" font-size="12.5" fill="#334155">adjacent views. All cameras sit on one line.</text>
<text x="446" y="552" font-size="12.5" font-weight="600" fill="#7f1d1d">Depth is weakly determined; roll barely observable.</text>

<rect x="832" y="444" width="388" height="128" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="852" y="468" font-size="13.5" font-weight="700" fill="#78350f">One side of every structure</text>
<text x="852" y="492" font-size="12.5" fill="#334155">Roofs and near walls are observed.</text>
<text x="852" y="510" font-size="12.5" fill="#334155">Far facades are never seen by any frame —</text>
<text x="852" y="528" font-size="12.5" fill="#334155">no algorithm can recover them.</text>
<text x="852" y="552" font-size="12.5" font-weight="600" fill="#78350f">They must be reported, not invented.</text>

<!-- BOTTOM STRIP -->
<rect x="20" y="586" width="1200" height="96" rx="8" fill="#1e293b"/>
<text x="40" y="612" font-size="14" font-weight="700" fill="#fbbf24">WHY THIS BREAKS CONVENTIONAL PHOTOGRAMMETRY</text>
<text x="40" y="638" font-size="13" fill="#e2e8f0">Structure-from-Motion assumes crossing passes. With every camera on one line the estimation problem becomes ill-conditioned —</text>
<text x="40" y="658" font-size="13" fill="#e2e8f0">it does not run slowly, it <tspan font-weight="700" fill="#fff">fails to converge</tspan>. Adding frames does not help: at 93.6% overlap the views are already there.</text>
<text x="40" y="676" font-size="12.5" fill="#94a3b8">The answer is a method that needs no initial poses, then a solve that restores metric scale and level from GPS and gravity.</text>
</svg>
