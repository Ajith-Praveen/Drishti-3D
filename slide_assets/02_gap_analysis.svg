<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <text x="20" y="30" font-size="23" font-weight="700" fill="#0f172a">Why Single-Pass Breaks Existing Tools</text>
  <text x="20" y="54" font-size="15" fill="#475569">A single flight strip is a <tspan font-weight="700" fill="#b91c1c">degenerate geometry</tspan> — not merely a speed problem</text>

  <!-- LEFT: multi-pass -->
  <rect x="20" y="76" width="380" height="238" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="40" y="102" font-size="15" font-weight="700" fill="#14532d">Multi-pass survey — what tools assume</text>
  <g stroke="#16a34a" stroke-width="1.6" fill="none">
    <line x1="60" y1="130" x2="360" y2="130"/><line x1="60" y1="152" x2="360" y2="152"/>
    <line x1="60" y1="174" x2="360" y2="174"/>
    <line x1="90" y1="118" x2="90" y2="186"/><line x1="160" y1="118" x2="160" y2="186"/>
    <line x1="230" y1="118" x2="230" y2="186"/><line x1="300" y1="118" x2="300" y2="186"/>
  </g>
  <circle cx="210" cy="230" r="7" fill="#16a34a"/>
  <g stroke="#86efac" stroke-width="1.3">
    <line x1="90" y1="174" x2="210" y2="230"/><line x1="160" y1="130" x2="210" y2="230"/>
    <line x1="300" y1="152" x2="210" y2="230"/><line x1="230" y1="174" x2="210" y2="230"/>
  </g>
  <text x="210" y="262" font-size="13" fill="#14532d" text-anchor="middle">wide triangulation angles</text>
  <text x="210" y="284" font-size="13.5" font-weight="700" fill="#14532d" text-anchor="middle">anisotropy ratio ≈ 2.15</text>
  <text x="210" y="303" font-size="12.5" fill="#166534" text-anchor="middle">uncertainty near-isotropic — well conditioned</text>

  <!-- RIGHT: single pass -->
  <rect x="424" y="76" width="380" height="238" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="444" y="102" font-size="15" font-weight="700" fill="#7f1d1d">Single pass — the actual problem</text>
  <line x1="464" y1="140" x2="764" y2="140" stroke="#dc2626" stroke-width="2"/>
  <g fill="#dc2626">
    <circle cx="494" cy="140" r="4"/><circle cx="554" cy="140" r="4"/><circle cx="614" cy="140" r="4"/>
    <circle cx="674" cy="140" r="4"/><circle cx="734" cy="140" r="4"/>
  </g>
  <circle cx="614" cy="240" r="7" fill="#dc2626"/>
  <g stroke="#fca5a5" stroke-width="1.3">
    <line x1="494" y1="140" x2="614" y2="240"/><line x1="554" y1="140" x2="614" y2="240"/>
    <line x1="614" y1="140" x2="614" y2="240"/><line x1="674" y1="140" x2="614" y2="240"/>
    <line x1="734" y1="140" x2="614" y2="240"/>
  </g>
  <ellipse cx="614" cy="240" rx="12" ry="46" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="4 3"/>
  <text x="614" y="298" font-size="13" fill="#7f1d1d" text-anchor="middle">narrow angles → depth barely observable</text>
  <text x="700" y="205" font-size="12.5" font-weight="700" fill="#b91c1c">elongated</text>
  <text x="700" y="222" font-size="12.5" font-weight="700" fill="#b91c1c">uncertainty</text>

  <!-- measured result -->
  <rect x="828" y="76" width="296" height="238" rx="8" fill="#1e293b"/>
  <text x="976" y="106" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">OUR MEASURED RESULT</text>
  <line x1="856" y1="118" x2="1096" y2="118" stroke="#475569"/>
  <text x="976" y="152" font-size="13" fill="#94a3b8" text-anchor="middle">Median anisotropy ratio</text>
  <text x="976" y="150" font-size="13" fill="#94a3b8" text-anchor="middle"></text>
  <text x="900" y="192" font-size="30" font-weight="700" fill="#4ade80" text-anchor="middle">2.15</text>
  <text x="900" y="212" font-size="11.5" fill="#94a3b8" text-anchor="middle">multi-view</text>
  <text x="1052" y="192" font-size="30" font-weight="700" fill="#f87171" text-anchor="middle">85.75</text>
  <text x="1052" y="212" font-size="11.5" fill="#94a3b8" text-anchor="middle">single-pass</text>
  <text x="976" y="248" font-size="19" font-weight="700" fill="#fbbf24" text-anchor="middle">≈ 40× difference</text>
  <text x="976" y="274" font-size="11.5" fill="#cbd5e1" text-anchor="middle">Worst-constrained axis is near-vertical,</text>
  <text x="976" y="291" font-size="11.5" fill="#cbd5e1" text-anchor="middle">reproducing the classical photogrammetric</text>
  <text x="976" y="306" font-size="11.5" fill="#cbd5e1" text-anchor="middle">"poor vertical accuracy from one strip"</text>

  <!-- table -->
  <text x="20" y="352" font-size="16" font-weight="700" fill="#0f172a">Existing methods and where they fail</text>
  <g font-size="13">
    <rect x="20" y="364" width="1104" height="30" fill="#1e293b"/>
    <text x="36" y="384" font-weight="700" fill="#fff">Approach</text>
    <text x="290" y="384" font-weight="700" fill="#fff">Examples</text>
    <text x="600" y="384" font-weight="700" fill="#fff">Failure on a single pass</text>

    <rect x="20" y="394" width="1104" height="29" fill="#f8fafc"/>
    <text x="36" y="413" fill="#0f172a">SfM + MVS photogrammetry</text>
    <text x="290" y="413" fill="#475569">COLMAP, Pix4D, Metashape, ODM</text>
    <text x="600" y="413" fill="#b91c1c">Needs 70–80% overlap, cross-strips. Hours. Scale drift</text>

    <rect x="20" y="423" width="1104" height="29" fill="#fff"/>
    <text x="36" y="442" fill="#0f172a">NeRF</text>
    <text x="290" y="442" fill="#475569">Instant-NGP, Zip-NeRF</text>
    <text x="600" y="442" fill="#b91c1c">Needs COLMAP poses first — already broken. Not metric</text>

    <rect x="20" y="452" width="1104" height="29" fill="#f8fafc"/>
    <text x="36" y="471" fill="#0f172a">3D Gaussian Splatting</text>
    <text x="290" y="471" fill="#475569">3DGS, 2DGS, SuGaR</text>
    <text x="600" y="471" fill="#b91c1c">Photorealistic but not metric, not georeferenced</text>

    <rect x="20" y="481" width="1104" height="29" fill="#fff"/>
    <text x="36" y="500" fill="#0f172a">Feed-forward pose-free</text>
    <text x="290" y="500" fill="#475569">DUSt3R, VGGT, Pi3, MapAnything</text>
    <text x="600" y="500" fill="#b45309">Solves poses, but scale-free · drifts · no georeferencing</text>

    <rect x="20" y="510" width="1104" height="29" fill="#f8fafc"/>
    <text x="36" y="529" fill="#0f172a">Autonomous scan</text>
    <text x="290" y="529" fill="#475569">Skydio 3D Scan</text>
    <text x="600" y="529" fill="#b91c1c">Solves it by flying <tspan font-style="italic">more</tspan> passes — the opposite of the ask</text>
  </g>

  <rect x="20" y="552" width="700" height="54" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="38" y="574" font-size="13" font-weight="700" fill="#78350f">THE GAP:</text>
  <text x="112" y="574" font-size="13" fill="#78350f">No system combines pose-free video reconstruction</text>
  <text x="38" y="594" font-size="13" fill="#78350f">with GPS metric anchoring and per-vertex confidence reporting.</text>

  <rect x="736" y="552" width="388" height="54" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="754" y="572" font-size="12.5" font-weight="700" fill="#14532d">Published evidence for our approach</text>
  <text x="754" y="590" font-size="12" fill="#166534">Feed-forward achieves <tspan font-weight="700">+50% completeness over COLMAP</tspan></text>
  <text x="754" y="604" font-size="11" fill="#166534">on sparse aerial input — arXiv:2507.14798</text>
</svg>
