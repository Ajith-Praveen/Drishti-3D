<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="20" y="30" font-size="23" font-weight="700" fill="#0f172a">Known Gaps &amp; How We Close Them</text>
<text x="20" y="54" font-size="15" fill="#475569">Every hard problem in this domain, named — with the specific mechanism that answers it</text>

<g font-size="12.5">
<rect x="20" y="70" width="1104" height="30" fill="#1e293b"/>
<text x="34" y="90" font-weight="700" fill="#fff">Gap in the field</text>
<text x="392" y="90" font-weight="700" fill="#fff">Why it is hard</text>
<text x="716" y="90" font-weight="700" fill="#fff">Our mechanism</text>

<rect x="20" y="100" width="1104" height="40" fill="#f8fafc"/>
<text x="34" y="118" fill="#0f172a" font-weight="600">Single strip is degenerate geometry</text>
<text x="34" y="133" font-size="11" fill="#64748b">SfM fails to converge, not merely slow</text>
<text x="392" y="118" fill="#475569">Narrow baseline, weak depth</text>
<text x="392" y="133" font-size="11" fill="#94a3b8">roll/pitch nearly unobservable</text>
<text x="716" y="125" fill="#1e40af">Pose-free feed-forward initialisation requiring no prior poses</text>

<rect x="20" y="140" width="1104" height="40" fill="#fff"/>
<text x="34" y="158" fill="#0f172a" font-weight="600">Feed-forward output is scale-free</text>
<text x="34" y="173" font-size="11" fill="#64748b">no real-world size, no geolocation</text>
<text x="392" y="158" fill="#475569">Models infer shape, not scale</text>
<text x="716" y="165" fill="#1e40af">GPS priors as factors inside bundle adjustment, not post-hoc scaling</text>

<rect x="20" y="180" width="1104" height="40" fill="#f8fafc"/>
<text x="34" y="198" fill="#0f172a" font-weight="600">Model tilts on a straight flight</text>
<text x="34" y="213" font-size="11" fill="#64748b">looks correct, measures wrong</text>
<text x="392" y="198" fill="#475569">Collinear cameras cannot fix roll</text>
<text x="716" y="205" fill="#1e40af">Gravity / Z-up prior from gimbal attitude, plus degeneracy detection</text>

<rect x="20" y="220" width="1104" height="40" fill="#fff"/>
<text x="34" y="238" fill="#0f172a" font-weight="600">Video is not a photo set</text>
<text x="34" y="253" font-size="11" fill="#64748b">18,000 frames, mostly redundant</text>
<text x="392" y="238" fill="#475569">Fixed stride wastes or starves</text>
<text x="716" y="245" fill="#1e40af">Keyframes spaced by GPS baseline in metres, scaled to altitude</text>

<rect x="20" y="260" width="1104" height="40" fill="#f8fafc"/>
<text x="34" y="278" fill="#0f172a" font-weight="600">Motion blur &amp; compression artefacts</text>
<text x="392" y="278" fill="#475569">Blurred frames poison matching</text>
<text x="716" y="285" fill="#1e40af">Sharpness-scored selection — sharpest candidate per window wins</text>

<rect x="20" y="300" width="1104" height="40" fill="#fff"/>
<text x="34" y="318" fill="#0f172a" font-weight="600">Dynamic objects contaminate geometry</text>
<text x="34" y="333" font-size="11" fill="#64748b">vehicles, people, animals</text>
<text x="392" y="318" fill="#475569">They violate the static assumption</text>
<text x="716" y="325" fill="#1e40af">Segmentation masks moving objects before fusion</text>

<rect x="20" y="340" width="1104" height="40" fill="#f8fafc"/>
<text x="34" y="358" fill="#0f172a" font-weight="600">Occluded surfaces are unrecoverable</text>
<text x="34" y="373" font-size="11" fill="#64748b">one pass sees one side only</text>
<text x="392" y="358" fill="#475569">Tools hide holes or invent geometry</text>
<text x="716" y="365" fill="#b45309" font-weight="600">Tagged INFERRED, excluded from measurement, corrective pass planned</text>

<rect x="20" y="380" width="1104" height="40" fill="#fff"/>
<text x="34" y="398" fill="#0f172a" font-weight="600">No tool reports its own reliability</text>
<text x="34" y="413" font-size="11" fill="#64748b">one undifferentiated mesh</text>
<text x="392" y="398" fill="#475569">Uncertainty is discarded after solving</text>
<text x="716" y="405" fill="#b45309" font-weight="600">Covariance → per-vertex trust tier, carried into every export</text>

<rect x="20" y="420" width="1104" height="40" fill="#f8fafc"/>
<text x="34" y="438" fill="#0f172a" font-weight="600">"≤1 m" claimed without qualification</text>
<text x="392" y="438" fill="#475569">Standalone GPS is bias-limited</text>
<text x="392" y="453" font-size="11" fill="#94a3b8">no algorithm removes receiver bias</text>
<text x="716" y="445" fill="#1e40af">Relative and absolute reported separately; cm only with RTK/PPK</text>

<rect x="20" y="460" width="1104" height="40" fill="#fff"/>
<text x="34" y="478" fill="#0f172a" font-weight="600">Research code is not deployable</text>
<text x="34" y="493" font-size="11" fill="#64748b">no offline tool for a field operator</text>
<text x="392" y="478" fill="#475569">Cloud is unusable for sensitive data</text>
<text x="716" y="485" fill="#1e40af">Native desktop application, single offline installer, no network call</text>
</g>

<!-- differentiators -->
<rect x="20" y="518" width="356" height="106" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="40" y="542" font-size="13.5" font-weight="700" fill="#78350f">The two amber rows are ours alone</text>
<text x="40" y="566" font-size="12.5" fill="#92400e">No commercial or research system ships</text>
<text x="40" y="584" font-size="12.5" fill="#92400e">per-vertex reliability, or converts it into</text>
<text x="40" y="602" font-size="12.5" fill="#92400e">a corrective flight recommendation.</text>

<rect x="392" y="518" width="356" height="106" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="412" y="542" font-size="13.5" font-weight="700" fill="#1e3a8a">Built on published work, cited</text>
<text x="412" y="566" font-size="12.5" fill="#1e40af">Feed-forward reconstruction, bundle</text>
<text x="412" y="584" font-size="12.5" fill="#1e40af">adjustment, volumetric fusion — all peer</text>
<text x="412" y="602" font-size="12.5" fill="#1e40af">reviewed. The synthesis is the contribution.</text>

<rect x="764" y="518" width="360" height="106" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="784" y="542" font-size="13.5" font-weight="700" fill="#14532d">Designed for the real operator</text>
<text x="784" y="566" font-size="12.5" fill="#166534">An analyst on a field laptop, air-gapped,</text>
<text x="784" y="584" font-size="12.5" fill="#166534">one chance to fly, and a decision to make</text>
<text x="784" y="602" font-size="12.5" fill="#166534">from whatever the model shows them.</text>
</svg>
