<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="20" y="30" font-size="23" font-weight="700" fill="#0f172a">Impact &amp; Benefits</text>
<text x="20" y="54" font-size="15" fill="#475569">Who uses it, what changes for them, and why it matters beyond the model itself</text>

<!-- who -->
<text x="20" y="88" font-size="16" font-weight="700" fill="#0f172a">The operator we design for</text>
<rect x="20" y="98" width="1104" height="74" rx="8" fill="#1e293b"/>
<text x="44" y="124" font-size="13.5" fill="#e2e8f0">Not "a user". An NTRO analyst or disaster-response officer, on a field laptop, with</text>
<text x="44" y="146" font-size="13.5" font-weight="700" fill="#fbbf24">no internet, one opportunity to fly, and a decision to make from the result.</text>
<text x="44" y="165" font-size="12" fill="#94a3b8">Every design decision in this system follows from that person's actual constraints.</text>

<!-- sectors -->
<rect x="20" y="188" width="266" height="188" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="153" y="214" font-size="14.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Defence &amp; Recon</text>
<text x="40" y="240" font-size="12.5" fill="#334155">Border and strategic area mapping</text>
<text x="40" y="262" font-size="12.5" fill="#334155">Mission planning from one sortie</text>
<text x="40" y="284" font-size="12.5" fill="#334155">Reduced exposure over hostile ground</text>
<text x="40" y="306" font-size="12.5" fill="#334155">Data never leaves the machine</text>
<rect x="40" y="322" width="226" height="42" rx="5" fill="#dbeafe"/>
<text x="52" y="341" font-size="11.5" font-weight="600" fill="#1e3a8a">Trust tiers prevent targeting or</text>
<text x="52" y="356" font-size="11.5" font-weight="600" fill="#1e3a8a">planning on unobserved geometry</text>

<rect x="300" y="188" width="266" height="188" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="433" y="214" font-size="14.5" font-weight="700" fill="#14532d" text-anchor="middle">Disaster Response</text>
<text x="320" y="240" font-size="12.5" fill="#334155">Damage assessment after earthquake,</text>
<text x="320" y="258" font-size="12.5" fill="#334155">flood, landslide or building collapse</text>
<text x="320" y="280" font-size="12.5" fill="#334155">No second pass over a hazard zone</text>
<text x="320" y="302" font-size="12.5" fill="#334155">Debris volume for resource planning</text>
<rect x="320" y="322" width="226" height="42" rx="5" fill="#dcfce7"/>
<text x="332" y="341" font-size="11.5" font-weight="600" fill="#14532d">Minutes to an actionable model,</text>
<text x="332" y="356" font-size="11.5" font-weight="600" fill="#14532d">not hours of post-processing</text>

<rect x="580" y="188" width="266" height="188" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="713" y="214" font-size="14.5" font-weight="700" fill="#78350f" text-anchor="middle">Infrastructure</text>
<text x="600" y="240" font-size="12.5" fill="#334155">Bridge, tower, dam, corridor inspection</text>
<text x="600" y="262" font-size="12.5" fill="#334155">Construction progress monitoring</text>
<text x="600" y="284" font-size="12.5" fill="#334155">Urban planning and digital twins</text>
<text x="600" y="306" font-size="12.5" fill="#334155">Archaeological documentation</text>
<rect x="600" y="322" width="226" height="42" rx="5" fill="#fef3c7"/>
<text x="612" y="341" font-size="11.5" font-weight="600" fill="#78350f">One pass instead of a survey grid —</text>
<text x="612" y="356" font-size="11.5" font-weight="600" fill="#78350f">less flight time, less operator effort</text>

<rect x="860" y="188" width="264" height="188" rx="8" fill="#1e293b"/>
<text x="992" y="214" font-size="14.5" font-weight="700" fill="#fbbf24" text-anchor="middle">Strategic</text>
<text x="880" y="240" font-size="12.5" fill="#e2e8f0">Indigenous, sovereign capability</text>
<text x="880" y="262" font-size="12.5" fill="#e2e8f0">No foreign cloud dependency</text>
<text x="880" y="284" font-size="12.5" fill="#e2e8f0">No per-seat licence outflow</text>
<text x="880" y="306" font-size="12.5" fill="#e2e8f0">Runs on hardware already owned</text>
<rect x="880" y="322" width="224" height="42" rx="5" fill="#422006"/>
<text x="892" y="341" font-size="11.5" font-weight="600" fill="#fbbf24">Replaces commercial licences</text>
<text x="892" y="356" font-size="11.5" font-weight="600" fill="#fbbf24">costing lakhs per seat annually</text>

<!-- benefit dimensions -->
<text x="20" y="410" font-size="16" font-weight="700" fill="#0f172a">Benefits by dimension</text>
<g font-size="12.5">
<rect x="20" y="422" width="1104" height="30" fill="#1e293b"/>
<text x="36" y="442" font-weight="700" fill="#fff">Dimension</text>
<text x="230" y="442" font-weight="700" fill="#fff">Benefit</text>

<rect x="20" y="452" width="1104" height="30" fill="#f8fafc"/>
<text x="36" y="472" fill="#0f172a" font-weight="600">Operational</text>
<text x="230" y="472" fill="#475569">One pass replaces a survey grid — shorter missions, fewer sorties, less operator workload</text>

<rect x="20" y="482" width="1104" height="30" fill="#fff"/>
<text x="36" y="502" fill="#0f172a" font-weight="600">Decision safety</text>
<text x="230" y="502" fill="#475569">Analysts see which geometry was measured and which was inferred — no false confidence</text>

<rect x="20" y="512" width="1104" height="30" fill="#f8fafc"/>
<text x="36" y="532" fill="#0f172a" font-weight="600">Economic</text>
<text x="230" y="532" fill="#475569">Open-source stack on existing hardware; no recurring licence or cloud compute cost</text>

<rect x="20" y="542" width="1104" height="30" fill="#fff"/>
<text x="36" y="562" fill="#0f172a" font-weight="600">Security</text>
<text x="230" y="562" fill="#475569">Sensitive footage never leaves the machine — deployable on air-gapped networks</text>

<rect x="20" y="572" width="1104" height="30" fill="#fef3c7"/>
<text x="36" y="592" fill="#0f172a" font-weight="700">Actionability</text>
<text x="230" y="592" fill="#78350f" font-weight="600">When one pass is not enough, the system states exactly which corrective flight to fly</text>
</g>
</svg>
