# The desktop builds for Linux, Windows and macOS, and the Linux + NVIDIA Docker image.
# Windows and Linux builds carry NVIDIA CUDA torch; GitHub's runners have no
# GPU, so the bundles are smoke-tested on the CPU.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            script: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
            artifact: dist/DRISHTI-3D-windows-x64.zip
          - os: ubuntu-24.04
            script: ./packaging/build_linux.sh
            artifact: dist/DRISHTI-3D-linux-x86_64.tar.gz
          - os: macos-14
            script: ./packaging/build_app.sh && ditto -c -k --keepParent dist/DRISHTI-3D.app dist/DRISHTI-3D-macos-arm64.zip
            artifact: dist/DRISHTI-3D-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt/VTK system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 ffmpeg
      - name: macOS environment
        if: runner.os == 'macOS'
        run: uv sync --locked --extra gui --extra ml --extra semantics --extra reference
      - name: build
        run: ${{ matrix.script }}
      - name: Build validator regression checks
        run: uv run --no-sync python -m unittest discover -s packaging -p test_smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build the Linux + NVIDIA image
        run: docker build -f packaging/Dockerfile -t drishti3d:cuda .
      - name: smoke test (CPU)
        run: docker run --rm --entrypoint python drishti3d:cuda packaging/smoke_test.py python packaging/entry.py
