# Local Apple Silicon run: accurate quality profile at 512 px.
#
# `quality_profile: accurate` retunes triage baseline spacing, matching, and
# the semantic agreement thresholds together (see config.py's profile
# tables). It ALSO sets geometry.max_image_size to 1288 -- which the
# explicit geometry section below overrides back down to 512, because
# load_config applies the profile first and then layers explicit sections on
# top. That layering is the point: "mostly accurate, but this one field
# pinned" without needing a fourth named profile.
#
# Why 512 and not larger, on this machine: MapAnything runs on MPS here, and
# measured MPS timings on this project's own hardware were ~7.6 s per 8-view
# window at 518 px versus ~66 s at 924 px -- nearly 9x for one resolution
# step. 512 keeps a full run in minutes rather than hours.
quality_profile: accurate

geometry:
  backbone: mapanything
  max_image_size: 956
  window_size: 8
  # One logical device on Apple Silicon regardless of GPU core count, so
  # this collapses to the sequential path either way. Stated explicitly
  # rather than left to auto-detect so the run is reproducible.
  max_devices: 1
  prefetch_frames: true

semantics:
  enabled: true
  model: segformer
  checkpoint: nvidia/segformer-b4-finetuned-ade-512-512
  # Matches the backbone resolution; no reason to segment finer than the
  # geometry it will be projected onto.
  max_image_size: 956
  # MPS has no separate VRAM pool -- it shares system memory -- so a large
  # batch competes with everything else on the machine rather than with a
  # fixed card budget. 2 is conservative and steady.
  batch_size: 2
  remove_dynamic: true
  min_vote_ratio: 0.6
  # 2, not 3. With 16 keyframes in 8-view windows most points are seen by
  # only a couple of segmented views, and min_views=3 left 63.7% of the
  # cloud UNLABELLED on the first local run -- recorded honestly as "never
  # seen by a segmented view", but useless. 3 is right for a long flight
  # with dense overlap, not a 16-keyframe smoke test.
  min_views: 2

texture:
  enabled: true
  # 4096, not 8192: the atlas bake is host-RAM bound (position/normal
  # buffers), and 8192 transiently needs ~1.2 GB for a diagnostic-grade
  # texture on a 16-keyframe run.
  texture_size: 4096
  blend_views: 4
  max_views: 60

fusion:
  # See FusionConfig: open3d's block-sparse TSDF makes tens of millions of
  # voxels affordable; 2M forced a 1.72 m voxel at true survey scale.
  voxel_count_budget: 30000000
  pre_tsdf_max_points: 6000000
